<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linkerlee Bookmarker — Options</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main class="card">
      <header class="card-header">
        <div class="brand">
          <img class="brand-mark" src="/icons/icon-48.png" alt="" />
          <h1 class="brand-title">Linkerlee Bookmarker</h1>
        </div>
      </header>

      <div class="card-body">
        <p class="lead">
          Connect the extension to your Linkerlee account. Generate a token under
          <em>Settings → API tokens</em> in Linkerlee, then paste it here.
        </p>

        <form id="form">
          <div class="field">
            <label class="field-label" for="baseUrl">Base URL</label>
            <input
              id="baseUrl"
              class="input"
              type="url"
              placeholder="https://linkerlee.com"
              autocomplete="off"
              required
            />
          </div>
          <p id="host-note" class="banner banner-warn"></p>

          <div class="field">
            <label class="field-label" for="token">API token</label>
            <input
              id="token"
              class="input"
              type="password"
              placeholder="Paste token"
              autocomplete="off"
              required
            />
          </div>

          <div class="row">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" id="test" class="btn btn-ghost">
              Test connection
            </button>
          </div>
        </form>

        <p id="status" class="status" hidden></p>
      </div>
    </main>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
